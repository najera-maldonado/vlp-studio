name: CI

# CI de VLP Studio (VLP-08). Filosofía de la investigación de reproducibilidad:
# CI valida EJECUCIÓN/cableado, no validez científica. Los motores pesados (HOLE,
# GROMACS) NO corren aquí; los tests de humo importan lazy y no los ejercen. Solo
# se necesitan las deps pip (Python 3.12 por rdkit==2025.9.1).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests de humo + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nanocapsule-mvp

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nanocapsule-mvp/requirements.lock

      - name: Instalar dependencias
        # Desde el lock (versiones exactas) → CI reproducible e idéntico a la imagen.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install ruff

      - name: Lint (ruff, config en pyproject.toml — VLP-10)
        run: ruff check src tests

      - name: Formato (ruff format --check)
        run: ruff format --check src tests

      - name: Tests de humo + golden (pytest)
        run: pytest -q

  engines:
    name: Los otros motores compilan
    runs-on: ubuntu-latest
    # Poromania/PackMan/sustratinaitor no tienen tests (son scripts + protocolos). Como
    # mínimo, CI verifica que TODO su Python parsea (compileall no importa, solo compila,
    # así que no necesita sus deps ni los motores pesados). Excluye la librería de terceros
    # SIRAH (bundle del force field, no es código propio).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar Python de los motores
        run: |
          python -m compileall -q -x 'sirah_x2\.3' \
            "Poromania.v.1.2." "PackMan.v.1.2" "sustratinaitor"
