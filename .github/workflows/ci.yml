name: CI

# CI de VLP Studio (VLP-08). Filosofía de la investigación de reproducibilidad:
# CI valida EJECUCIÓN/cableado, no validez científica. Los motores pesados (HOLE,
# GROMACS) NO corren aquí; los tests de humo importan lazy y no los ejercen. Solo
# se necesitan las deps pip (Python 3.12 por rdkit==2025.9.1).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests de humo + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nanocapsule-mvp

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nanocapsule-mvp/requirements.lock

      - name: Instalar dependencias
        # Desde el lock (versiones exactas) → CI reproducible e idéntico a la imagen.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install ruff

      - name: Lint (ruff, config en pyproject.toml — VLP-10)
        run: ruff check src tests

      - name: Formato (ruff format --check)
        run: ruff format --check src tests

      - name: Tests de humo + golden (pytest)
        run: pytest -q
