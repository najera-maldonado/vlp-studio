############################################################# 
##  NpT relaxation with protein backbone constraints       ## 
#############################################################

# Relaxation at constant temperature for solvent 
# Protein backbone atoms are constrained 

############################################################# 
## INPUT PARAMETERS                                        ## 
############################################################# 

amber              on                       ;# Turns on the AMBER parameters input 
parmfile           ../1CRN_cg_ionized.prmtop   ;# File containing the force field parameters (atom parameters, bonds, etc.), bluid in LEaP 
coordinates        ../1CRN_cg_ionized.pdb	    ;# File containing the initial coordinates, build in LEaP 

if {1} {                                    ;# This block checks for a restart files from a previous simulation (heating) 
set inputname      eq1                      ;# Root name for restart files                                   
binCoordinates     $inputname.restart.coor  ;# Read coordinate restart file 
binVelocities      $inputname.restart.vel   ;# Read velocity restart file 
extendedSystem     $inputname.restart.xsc   ;# Read extended system restart file 
} 

############################################################# 
## OUTPUT PARAMETERS                                       ## 
############################################################# 

set outputName     eq2              ;# Name of the file that will contain energy and other variable information during the simulation 
outputName         $outputName      ;# Variable that stores the output file name 
binaryoutput       no               ;# Specifies whether a binary trajectory file is generated 
binaryrestart      yes              ;# Specifies whether a binary restart file is generated
restartfreq        5000             ;# Frequency of restart file generation (in steps) 
dcdfreq            5000             ;# Frequency of DCF file generation (in steps) 
xstFreq            5000             ;# Frequency of XST file generation (in steps) 
outputEnergies     5000             ;# Frequency of energy output to the output file (in steps) 
outputPressure     5000             ;# Frequency of pressure output to the output file (in steps) 

############################################################# 
## SIMULATION PARAMETERS                                   ##
############################################################# 

firsttimestep      0                ;# Sets the first time step to 0 
set temperature    300              ;# Sets the temperature to 300 Kelvin 

# Force Field Parameters 
useSettle          off              ;# Turns on the SETTLE algorithm for water 
cutoff             12.0             ;# Cutoff radius for non-bonded interactions (in Å) 
pairlistdist       14.0             ;# Distance for neighbor list generation (in Å) 
switching          off              ;# Turns on the switching method for non-bonded interactions 
exclude            scaled1-4        ;# Type of exclusions for non-bonded interactions 
readexclusions     yes              ;# Specifies whether exclusions are read from a file 
1-4scaling         0.83333333       ;# Scaling factor for 1-4 interactions 
scnb               2.0              ;# VDW 1-4 scaling factor 
ljcorrection       on               ;# Turns on the LJ correction for atom pairs of different types 

# Integrator Parameters 
timestep           20               ;# Time step between integration steps (in fs) 
nonbondedFreq      1                ;# Frequency of non-bonded force calculation 
stepspercycle      10               ;# Number of steps per integration cycle. Automatically adjusted in NAMD3 

# Periodic Cell 
if {0} { 
cellBasisVector1   72.3223    00.0000    00.0000 
cellBasisVector2   00.0000    70.2433    00.0000 
cellBasisVector3   00.0000    00.0000    72.8663 
cellOrigin         00.0000    00.0000    00.0000
} 

wrapWater          on               ;# Wrap water coordinates around periodic boundaries 
wrapAll            on               ;# Wrap all coordinates around periodic boundaries 

#PME (Particle Mesh Ewald) for calculating electrostatics in periodic systems. 
if {1} {                                                    	             ;# If 0 don't read the block 
PME                yes              ;# Turns on PME for electrostatic calculations 
PMETolerance       1.0e-6           ;# Tolerance level for PME accuracy 
PMEInterpOrder     4                ;# Interpolation order for PME 
FFTWUseWisdom      no               ;# Disables usage of FFTW wisdom (performance optimization) 
PMEGridspacing     1                ;# Spacing of the PME grid 
} 

# Temperature control 
if {1} {                            ;# If 0 don't read the block 
langevin           on               ;# Turns off Langevin thermostat 
langevinDamping    50               ;# Damping coefficient for Langevin dynamics (if on) gamma of 50/ps 
langevinHydrogen   off              ;# Turns off Langevin dynamics for hydrogen atoms (if on) 
langevinTemp       $temperature     ;# Temperature target for Langevin dynamics (if on) 
} 

# Pressure  control 
if {1} {                              ;# If 0 don't read the block                                                	  
useGroupPressure     no               ;# Disables group pressure control 
useFlexibleCell      no               ;# Disables flexible cell (not for water boxes) 
useConstantArea      no               ;# Disables constant area control (not for water boxes) 
langevinPiston       on               ;# Enable Langevin piston for pressure control (off by default) 
langevinPistonTarget 1.01325          ;# Target pressure for Langevin piston (in bar) (if on). 
langevinPistonPeriod 200.             ;# Period of the Langevin piston (if on) 
langevinPistonDecay  100.             ;# Decay time of the Langevin piston (if on)
langevinPistonTemp   $temperature     ;# Temperature target for Langevin piston (if on) 
} 

############################################################# 
#ADDITIONAL PARAMETERS                                     ##
############################################################# 

#Constraints of protein backbone
if {1} {                                  ;# If 1 read the block 
constraints          on                   ;# Turns on constraints 
consref              eq1.coor             ;# Reference PDB file for constraint positions 
conskfile            ../bb_restraints.pdb ;# File containing constraint force constants 
constraintScaling    0.1                  ;# Scaling factor for constraint forces 
consexp              2                    ;# Exponent for constraint potential 
conskcol             B                    ;# Column for constraint forces in the reference file (B for force constants) 
} 

#NAMD3 parameters 
if {1} {                                  ;# If 1 read the block, only used in NAMD3 calculations 
CUDASOAintegrate     on                   ;# Disables CUDA accelerated calculations (if ON activates the GPU resident mode. Unable to use in minimization step) 
} 

############################################################# 
#EXECUTION INSTRUCTIONS                                    ##
############################################################# 

run                	1250000          ;# 5ns of simulation

############################################################# 
#VERIFICATION OF OUTPUT FILES                              ## 
############################################################# 

set file [open eq2.check w+] ;# Opens a file for writing verification information 
set done 1                               ;# Sets a done flag to 1 (assuming success) 
if {[file exists eq2.restart.coor] != 1 || [file exists eq2.restart.vel] != 1 || [file exists eq2.restart.xsc] != 1 } { ;#Checks for existence of all required output files and sets done flag to 0 if any file is missing 
     set done 0                                             	 
} 
if {$done == 1} { 
      	puts $file "READY"               ;# Writes "READY" to the verification file if successful 
flush $file 
   close $file 
} else { 
	puts $file "One or more output files not found" ;# Writes error message to the verification file if any file is missing 
   flush $file 
  close $file 
}
